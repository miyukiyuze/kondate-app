// GitHub Pages などで公開すればデータは自動でずっと残ります。
async function storageGet(key) {
  const v = window.localStorage.getItem(key);
  return v !== null ? { key, value: v } : null;
}
async function storageSet(key, value) {
  window.localStorage.setItem(key, value);
  return { key, value };
}

function matchesKeyword(dish, keyword) {
  const k = keyword.trim();
  if (!k) return false;
  if (dish.name.includes(k)) return true;
  if (dish.tags.some((t) => t.includes(k) || k.includes(t))) return true;
  if (dish.recipe && dish.recipe.ingredients) {
    return dish.recipe.ingredients.some((ing) => ing.name.includes(k) || k.includes(ing.name));
  }
  return false;
}

function formatDate(d) {
  const days = ["日", "月", "火", "水", "木", "金", "土"];
  return `${d.getMonth() + 1}/${d.getDate()}(${days[d.getDay()]})`;
}

  }

  async function saveHistory(next) {

    } catch (e) {}

  function showToast(msg) {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2200);
  }

  function whoLikes(dish) {
    if (!dish) return [];
    return family.filter((f) => f.likes.some((l) => matchesKeyword(dish, l)));
  }

  function buildQueue(category, moodId, leftoverText, recentNames, stapleId) {
    let base = allDishes.filter((d) => d.category === category);
    if (category === "main" && stapleId) {
      base = base.filter((d) => !d.staple || d.staple === stapleId);
    }
    if (category === "side" && stapleId === "noodle") {
      base = base.filter((d) => !d.heavyCarb);
    }
    base = base.filter(
      (d) => !family.some((f) => f.allergies.some((a) => matchesKeyword(d, a)))
    );

    let pool = base.filter((d) => d.mood.length === 0 || d.mood.includes(moodId));

    if (leftoverText.trim()) {
      const withMood = pool.filter((d) => matchesKeyword(d, leftoverText));
      if (withMood.length > 0) {
        pool = withMood;
      } else {
        const anyMood = base.filter((d) => matchesKeyword(d, leftoverText));
        if (anyMood.length > 0) {
          pool = anyMood;
        } else {
          return [];
        }
      }
    }

    const notRecent = pool.filter((d) => !recentNames.includes(d.name));
    if (notRecent.length > 0) pool = notRecent;

    const scored = pool.map((d) => {
      let score = 0;
      family.forEach((f) => {
        if (f.likes.some((l) => matchesKeyword(d, l))) score += 2;
        if (f.dislikes.some((l) => matchesKeyword(d, l))) score -= 3;
      });
      return { ...d, score };
    });

    let good = scored.filter((d) => d.score >= 0);
    if (good.length === 0) good = scored;

    good.sort((a, b) => b.score - a.score || Math.random() - 0.5);
    return good;
  }

  function generate(stapleId, moodId) {
    const recentMain = history.slice(0, 3).map((h) => h.main).filter(Boolean);
    const recentSide = history.slice(0, 3).map((h) => h.side).filter(Boolean);

    const mQ = buildQueue("main", moodId, leftover, recentMain, stapleId);
    const sQ = buildQueue("side", moodId, leftover, recentSide, stapleId);

    if (mQ.length === 0 && sQ.length === 0) {
      setCurrentMain(null);
      setCurrentSide(null);
      if (leftover.trim()) {
        setEmptyMsg(`「${leftover.trim()}」を使った献立が見つかりませんでした。別の食材を試すか、下からレシピを登録してみてください。`);
      } else {
        setEmptyMsg("条件に合う献立が見つかりませんでした。条件を変えて試してみてください。");
      }
      return;
    }

    setEmptyMsg("");
    setDecided(false);
    setOpenRecipe({ main: false, side: false });
    setCurrentMain(mQ[0] || null);
    setMainQueue(mQ.slice(1));
    setCurrentSide(sQ[0] || null);
    setSideQueue(sQ.slice(1));
  }

  function handleStaple(stapleId) {
    setStaple(stapleId);
    if (mood) generate(stapleId, mood);

  function handleMoodClick(moodId) {

    generate(staple, moodId);
  }

  function handleChangeSide() {

    setSideQueue(sideQueue.slice(1));

  function handleBothSkip() {

  function pickMisoIngredient(exclude) {
    const options = MISO_INGREDIENTS.filter((m) => m !== exclude);
    return options[Math.floor(Math.random() * options.length)];

  function handleMisoChoice(want) {
    setWantsMiso(want);
    setMisoIngredient(want ? pickMisoIngredient(null) : null);
  }

  function handleChangeMiso() {

  }

  async function handleDecide() {
    if (!currentMain && !currentSide) return;
    const entry = {
      date: formatDate(new Date()),
      main: currentMain ? currentMain.name : null,
      side: currentSide ? currentSide.name : null,
      miso: wantsMiso ? misoIngredient : null,
      mood,

    const next = [entry, ...history].slice(0, 30);
    await saveHistory(next);
    setDecided(true);
  }

    setCurrentMain(null);
    setCurrentSide(null);
    setStaple(null);
    setMood(null);
    setLeftover("");

    setMainQueue([]);
    setSideQueue([]);
    setDecided(false);
    setOpenRecipe({ main: false, side: false });
  }

  function toggleEditor(id) {
    setOpenEditor(openEditor === id ? null : id);
  }

  function addTag(memberId, field) {
    const text = (newTag[memberId + field] || "").trim();
    if (!text) return;
    const next = family.map((f) =>
      f.id === memberId ? { ...f, [field]: [...f[field], text] } : f
    );
    saveFamily(next);
    setNewTag({ ...newTag, [memberId + field]: "" });
  }

  function removeTag(memberId, field, idx) {
    const next = family.map((f) =>
      f.id === memberId
        ? { ...f, [field]: f[field].filter((_, i) => i !== idx) }
        : f
    );
    saveFamily(next);
  }

  function toggleRecipeMood(id) {
    setRecipeMoods((prev) => (prev.includes(id) ? prev.filter((m) => m !== id) : [...prev, id]));
  }

  function updateIngredientRow(idx, field, value) {
    const next = recipeIngredients.map((row, i) => (i === idx ? { ...row, [field]: value } : row));
    setRecipeIngredients(next);
  }

  function addIngredientRow() {
    setRecipeIngredients([...recipeIngredients, { name: "", amount: "" }]);
  }

  function removeIngredientRow(idx) {
    if (recipeIngredients.length === 1) return;
    setRecipeIngredients(recipeIngredients.filter((_, i) => i !== idx));
  }

  function updateStepRow(idx, value) {
    const next = recipeSteps.map((s, i) => (i === idx ? value : s));

  async function handleAddRecipe() {
    if (!recipeName.trim()) {
      setRecipeError("料理名を入力してください");
      return;
    }
    const ingredients = recipeIngredients.filter((r) => r.name.trim());
    if (ingredients.length === 0) {
      setRecipeError("材料を1つ以上入力してください");
      return;
    }
    const steps = recipeSteps.map((s) => s.trim()).filter(Boolean);
    if (steps.length === 0) {
      setRecipeError("作り方を1つ以上入力してください");
      return;
    }
    setRecipeError("");
    const newDish = {
      id: "custom-" + Date.now(),
      name: recipeName.trim(),
      category: recipeCategory,
      staple: recipeCategory === "main" ? recipeStaple : null,
      mood: recipeMoods,
      kid: recipeKid,
      tags: ingredients.map((i) => i.name.trim()),
      custom: true,
      recipe: {
        servings: recipeServings.trim() || "4人分",
        ingredients,
        steps,
      },
    };
    const next = [...customDishes, newDish];
    await saveCustomDishes(next);
    showToast(`「${newDish.name}」を登録しました`);
    setRecipeName("");
    setRecipeStaple(null);
    setRecipeMoods([]);
    setRecipeServings("4人分");
    setRecipeKid(false);
    setRecipeIngredients([{ name: "", amount: "" }]);
    setRecipeSteps([""]);
  }

      setRestoreError("");
      await saveFamily(Array.isArray(parsed.family) ? parsed.family : DEFAULT_FAMILY);
      await saveHistory(Array.isArray(parsed.history) ? parsed.history : []);
      await saveCustomDishes(Array.isArray(parsed.customDishes) ? parsed.customDishes : []);
      showToast("復元しました");
      setRestoreText("");

    recipeToggle: { width: "100%", textAlign: "left", background: "#FFF6FA", border: "1.5px solid #F6D3E0", borderRadius: "14px", padding: "11px 14px", fontSize: "13px", color: "#E0699A", cursor: "pointer", marginTop: "6px", fontWeight: 500 },

      </div>

  }

  function renderRecipePanel(dish) {

      <div style={styles.recipePanel} className="kfade">
        <p style={styles.recipeServings}>{dish.recipe.servings}</p>
        <div style={styles.recipeIngList}>

            <div key={i} style={{ display: "flex", justifyContent: "space-between" }}>
              <span>{ing.name}</span>
              <span style={{ color: "#B58AA0" }}>{ing.amount}</span>

        </div>
        <ol style={styles.recipeStepList}>

                    <span style={{ cursor: "pointer" }} onClick={() => removeTag(f.id, "likes", i)}>×</span>
                  </span>
                ))}
              </div>
              <div style={styles.tagInputRow}>
                <input
                  style={styles.input}
                  placeholder="例：鶏肉、カレー"

                  onKeyDown={(e) => e.key === "Enter" && addTag(f.id, "likes")}
                />
                <button style={styles.smallBtn} onClick={() => addTag(f.id, "likes")}>追加</button>
              </div>

              <p style={{ fontSize: "12px", color: "#B58AA0", margin: "12px 0 4px" }}>苦手なもの・アレルギー</p>
              <div style={styles.tagList}>
                {f.dislikes.map((t, i) => (
                  <span key={i} style={styles.tag("#FFE3DD", "#C2577A")}>
                    {t}
                    <span style={{ cursor: "pointer" }} onClick={() => removeTag(f.id, "dislikes", i)}>×</span>
                  </span>
                ))}
                {f.allergies.map((t, i) => (
                  <span key={"a" + i} style={styles.tag("#F7C9D4", "#B0446F")}>
                    ⚠ {t}
                    <span style={{ cursor: "pointer" }} onClick={() => removeTag(f.id, "allergies", i)}>×</span>
                  </span>
                ))}
              </div>
              <div style={styles.tagInputRow}>
                <input
                  style={styles.input}
                  placeholder="苦手なもの（例：ピーマン）"
                  value={newTag[f.id + "dislikes"] || ""}
                  onChange={(e) => setNewTag({ ...newTag, [f.id + "dislikes"]: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && addTag(f.id, "dislikes")}
                />
                <button style={styles.smallBtn} onClick={() => addTag(f.id, "dislikes")}>追加</button>
              </div>
              <div style={{ ...styles.tagInputRow, marginTop: "6px" }}>
                <input
                  style={styles.input}
                  placeholder="アレルギー（例：卵）"
                  value={newTag[f.id + "allergies"] || ""}
                  onChange={(e) => setNewTag({ ...newTag, [f.id + "allergies"]: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && addTag(f.id, "allergies")}
                />
                <button style={styles.smallBtn} onClick={() => addTag(f.id, "allergies")}>追加</button>
              </div>
            </div>
          )
      )}

      <p style={styles.sectionLabel}>🍽️ ご飯か麺か</p>

                <div style={styles.radioBtn(recipeStaple === "noodle")} onClick={() => setRecipeStaple("noodle")}>🍜 麺</div>
              </div>
            </div>

              <span>
                <span style={{ color: "#D9A9C0", marginRight: "6px" }}>
                  {d.category === "main" ? "主菜" : "副菜"}
                  {d.staple === "rice" && " 🍚"}
                  {d.staple === "noodle" && " 🍜"}
                </span>
                {d.name}
              </span>
              <button style={{ ...styles.changeLink, color: "#C2477B" }} onClick={() => handleDeleteRecipe(d.id)}>削除</button>
            </div>
          ))}
        </div>
      )}

      <p style={styles.sectionLabel}>💾 データのバックアップ</p>
      <div style={styles.editorBox}>
        <p style={styles.backupNote}>
          自動で保存されない場合は、使い終わったら下の文章をコピーしてメモ帳などに保存しておいてください。次にこのアプリを開いたときは、保存しておいた文章を貼り付けて「復元する」を押すと元に戻ります。
        </p>
        <textarea style={{ ...styles.textarea, minHeight: "60px" }} readOnly value={backupJson} />
        <button style={{ ...styles.smallBtn, marginTop: "8px", width: "100%" }} onClick={copyBackup}>
          この内容をコピーする
        </button>

        <p style={{ ...styles.formLabel, marginTop: "16px" }}>復元する（保存しておいた文章を貼り付け）</p>
        <textarea
          style={{ ...styles.textarea, minHeight: "60px" }}
          placeholder="ここに貼り付け"
          value={restoreText}
          onChange={(e) => setRestoreText(e.target.value)}
        />
        {restoreError && <p style={styles.errorText}>{restoreError}</p>}
        <button style={{ ...styles.goodBtn, marginTop: "8px" }} onClick={handleRestore}>
          復元する
        </button>
      </div>

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<KondateApp />);
</script>
</body>
</html>
